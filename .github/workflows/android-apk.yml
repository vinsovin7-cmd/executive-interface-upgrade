name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public HTTPS URL of the deployed CyberNode app
        required: true
        type: string
        default: https://executive-interface-upgrade.vercel.app

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        env:
          APP_URL: ${{ inputs.app_url }}
        run: bash android/build-apk.sh "$APP_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cybernode-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
